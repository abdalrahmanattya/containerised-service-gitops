apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: containerised-service
  labels:
    app.kubernetes.io/name: containerised-service
    app.kubernetes.io/part-of: containerised-service-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: containerised-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
